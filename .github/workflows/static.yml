# Simple workflow for deploying static content to Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Sitenin yayınlanacak dosyalarını _site/ altında topla.
      # Eskiden tüm repo (path: '.') yayınlanıyordu; bu, geliştirme dosyalarını
      # ve yetkili e-posta listesini de herkese açık hale getiriyordu.
      - name: Yayın klasörünü hazırla
        run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'node_modules' \
            --exclude 'sahibinden' \
            --exclude 'firestore.rules' \
            --exclude 'storage.rules' \
            --exclude 'assets/js/admin-config.js' \
            ./ _site/
          echo "--- yayınlanacak dosyalar ---"
          find _site -type f | sort

      # admin-config.js yayından çıkarıldığı için admin.html panelde import
      # edemez. Panelin çalışmaya devam etmesi için yer tutucu bir dosya konur;
      # yetkisiz hesaplar zaten Firestore kurallarıyla engellenir.
      - name: Panel için yer tutucu yetki dosyası
        run: |
          cat > _site/assets/js/admin-config.js <<'EOF'
          // Yetkili adres listesi yayına dahil edilmez.
          // Panel arayüzü bu listeyle gizlenmez; gerçek yetkilendirme
          // firestore.rules / storage.rules tarafından sunucuda yapılır.
          export const ALLOWED_EMAILS = null;
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
